[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tacit"
version = "0.2.0"
description = "A recurrent decision core that answers typed questions instead of writing text."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Yirui Li" }]
keywords = [
    "structured-decisions",
    "calibration",
    "recurrent",
    "state-space",
    "phase-collapse",
    "system-one",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5"]
bench = ["numpy>=1.24", "matplotlib>=3.7", "requests>=2.32"]
semantic = ["transformers>=5.4,<6", "numpy>=1.24", "pyarrow>=14", "safetensors>=0.4"]

[project.urls]
Homepage = "https://github.com/CARBON-XXX/Tacit"
Issues = "https://github.com/CARBON-XXX/Tacit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tacit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SLF001"]
